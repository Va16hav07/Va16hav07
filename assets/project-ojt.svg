<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-label="OJT Journal Maker: Turns an internship summary into day-by-day journal entries and fills the PDF template automatically."><title>OJT Journal Maker: Turns an internship summary into day-by-day journal entries and fills the PDF template automatically.</title><style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
