<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-label="Multi-Agent Travel Planner: Four specialised agents collaborate to turn a free-text request into a complete, budgeted travel plan."><title>Multi-Agent Travel Planner: Four specialised agents collaborate to turn a free-text request into a complete, budgeted travel plan.</title><style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.flow{stroke-dasharray:10 600;animation:flow 3.2s linear infinite}
