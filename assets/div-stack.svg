<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="48" viewBox="0 0 1200 48" role="img" aria-label="Stack"><title>Stack</title><style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.flow{stroke-dasharray:10 600;animation:flow 3.2s linear infinite}
@keyframes flow{from{stroke-dashoffset:610}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x="1" y="1" width="1198" height="46" rx="14" fill="#0b0f14" stroke="#1e2a36" stroke-width="1.5"/><text x="28" y="30" class="m" font-size="14" fill="#3ddc97" font-weight="700" text-anchor="start" >04</text><text x="64" y="30" class="m" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="start" letter-spacing="3">STACK</text><line x1="146.5" y1="24" x2="1140" y2="24" stroke="#1b2733" stroke-width="2"/><line x1="146.5" y1="24" x2="1140" y2="24" stroke="#3ddc97" stroke-width="2" class="flow"/><circle cx="1160" cy="24" r="5" fill="#3ddc97" class="pulse"/></svg>
